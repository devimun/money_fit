# Generated by store_release.
#
# Keep this file in the app project root, similar to pubspec.yaml.
# The global `store_release` CLI reads this file to decide:
# - which App Store / Play Store app to upload to
# - how Flutter builds should be created
# - where marketing screenshots are exported
# - which screenshot sizes should be copied into fastlane
#
# Typical first run:
#   store_release
#
# Useful automation commands:
#   store_release update --project money_fit --store both --target all --env store_release --deployment upload_only
#   store_release sync-screenshot-sizes --project money_fit
#
schema_version: 1

# App identity.
# For Flutter projects these usually match:
# - iOS: PRODUCT_BUNDLE_IDENTIFIER in ios/Runner.xcodeproj/project.pbxproj
# - Android: applicationId or namespace in android/app/build.gradle(.kts)
app:
  name: "MoneyFit"
  slug: "money_fit"
  bundle_id: "com.moneyfitapp.app"
  package_name: "com.moneyfitapp.app"

# Profile names are labels for your own credential grouping.
# They do not have to match Apple/Google team names, but keeping them stable
# helps when you manage many apps.
profiles:
  apple: default
  google_play: default

# App shell registration.
# App Store can be created by fastlane produce, but this may still require
# Apple ID authentication and 2FA. Uploads after creation use API keys.
# Play Store app shell creation is completed in Play Console; store_release
# generates a checklist with the exact values to enter.
registration:
  app_store:
    enabled: true
    # username: apple-id@example.com
    sku: "money_fit"
    primary_language: English
    platform: ios
    initial_version: "1.0.0"
    # team_id:
    # itc_team_id:
    # company_name:
  play_store:
    enabled: true
    console_url: https://play.google.com/console
    default_language: en-US

# Shared credentials live outside app repositories.
# With the profile names above, store_release expects:
#   /Users/jun/Desktop/store-release/credentials/profiles/default/app_store_connect_api_key.json
#   /Users/jun/Desktop/store-release/credentials/profiles/default/google_play_service_account.json
#
# Recommended local setup:
#   mkdir -p /Users/jun/Desktop/store-release/credentials/profiles/default
#   chmod 700 /Users/jun/Desktop/store-release/credentials/profiles/default
#   chmod 600 /Users/jun/Desktop/store-release/credentials/profiles/default/*.json
#
# App Store Connect API key JSON example for fastlane --api_key_path:
#   {
#     "key_id": "ABC123DEFG",
#     "issuer_id": "00000000-0000-0000-0000-000000000000",
#     "key": "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----",
#     "duration": 1200,
#     "in_house": false
#   }
#
# Google Play uses the service account JSON downloaded from Google Cloud /
# Play Console. Put that file at google_play_service_account.json.
#
# To override paths for one project only, uncomment and edit:
# credentials:
#   app_store_connect_api_key_path: /secure/path/app_store_connect_api_key.json
#   google_play_json_key_path: /secure/path/google_play_service_account.json

# Store upload targets.
# Set enabled/build/metadata/screenshots to false when a project should skip
# that store or asset type.
stores:
  app_store:
    enabled: true
    bundle_id: "com.moneyfitapp.app"
    screenshots: true
    metadata: true
    build: true
  play_store:
    enabled: true
    package_name: "com.moneyfitapp.app"
    default_track: internal
    screenshots: true
    metadata: true
    build: true

# Flutter version source.
# Example pubspec.yaml:
#   version: 1.0.0+1
#
# The CLI increments the build number after + for app builds.
# With the example above, the next build becomes 1.0.0+2 when version_name
# is kept.
versioning:
  source: pubspec.yaml
  persist: true
  build_number:
    strategy: increment
    current_source: pubspec
  version_name:
    strategy: prompt
    default: keep
    choices:
      - keep
      - patch
      - minor
      - major
      - custom

# Build environments.
# Each dart_defines entry is appended as:
#   --dart-define=KEY=value
#
# Flutter code example:
#   const appEnv = String.fromEnvironment('APP_ENV');
#
# Common pattern:
# - store_test: release build that points analytics/API to test resources
# - store_release: release build that points analytics/API to production
build_env:
  strategy: flutter_dart_define
  presets:
    store_test:
      label: Store test
      dart_defines:
        APP_ENV: store_test
    store_release:
      label: Store release
      dart_defines:
        APP_ENV: store_release

# Build commands and artifact paths.
# The CLI appends --build-name, --build-number, and build_env dart-defines.
#
# iOS artifact example:
#   build/ios/ipa/*.ipa
# Android artifact example:
#   build/app/outputs/bundle/release/app-release.aab
build:
  ios:
    command: flutter build ipa --release
    artifact: build/ios/ipa/*.ipa
  android:
    command: flutter build appbundle --release
    artifact: build/app/outputs/bundle/release/app-release.aab
    signing: release

# Marketing screenshot outputs.
# App Store Screenshots editor should export bundles here:
#   marketing-screenshot/outputs/ios/...
#   marketing-screenshot/outputs/android/...
#
# If the editor generates different WxH folders later, run:
#   store_release sync-screenshot-sizes --project money_fit
#
# The CLI copies from output_dir into fastlane's expected folders.
screenshots:
  project_dir: "marketing-screenshot"
  output_dir: "marketing-screenshot/outputs"
  export_dir: "marketing-screenshot/exports"
  # upload_policy.sizes controls which generated sizes are copied.
  # When sizes is present, it wins over strategy. Run sync-screenshot-sizes
  # after Export bundle if you want this file to match every WxH folder
  # currently present in marketing-screenshot/outputs.
  upload_policy:
    app_store:
      iphone:
        strategy: highest_supported_size
        sizes:
          - 1320x2868
    play_store:
      android:
        strategy: phone_portrait
        sizes:
          - 1080x1920
  devices:
    app_store:
      - iphone
    play_store:
      - android

# Optional metadata source.
# Fastlane-compatible files can live under this directory if you decide to
# manage store listing text in git later.
metadata:
  source_dir: store-metadata

# Locale mapping from screenshot editor locale -> store locale.
# Left side is the folder produced under marketing-screenshot/outputs.
# Right side is the locale code expected by App Store Connect / Play Store.
#
# Examples:
#   en -> App Store en-US, Play Store en-US
#   ko -> App Store ko, Play Store ko-KR
locales:
  ko:
    app_store: ko
    play_store: ko-KR
  en:
    app_store: en-US
    play_store: en-US
  ja:
    app_store: ja
    play_store: ja-JP
  es:
    app_store: es-ES
    play_store: es-ES

# Interactive menu defaults.
# Normal use is just:
#   store_release
# and then choose from these options.
release_flow:
  update_targets:
    - all
    - build
    - metadata
    - screenshots
  store_targets:
    - app_store
    - play_store
    - both
  build_env_prompt:
    enabled: true
    required_when:
      - all
      - build
  deployment:
    default: upload_only
    choices:
      - upload_only
      - test
      - production
